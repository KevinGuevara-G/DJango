<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Nuevo Post</title>
</head>
<body>
    <h1>Crear una nueva publicación</h1>
    <hr>

    <form method="POST">
        {% csrf_token %} 
        
        {{ form.as_p }}
        
        <button type="submit">Publicar Post</button>
    </form>

    <br>
    <a href="{% url 'lista_posts' %}">Volver al inicio</a>
</body>
</html>
